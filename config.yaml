name: "Wyoming Hailo Whisper"
description: "Hailo Whisper model for HA addon"
version: "0.0.10"
slug: "hailo_whisper_addon"
init: false
arch:
  - aarch64
startup: services
ports:
  10600/tcp: 10600
devices: ["/dev/hailo0"]
udev: true
options:
  variant: base
  device: hailo8l
  language: ru
schema:
  variant: list(tiny|base)
  device: list(hailo8|hailo8l)
  language: select(en|ru|es|fr|de|it|pt|zh|ja|ko|ar|hi|uk|cs|pl|tr|nl|sv|vi|th)
